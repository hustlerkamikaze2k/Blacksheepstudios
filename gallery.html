  <div class="page-head">
    <h2>The <span class="accent">gallery</span></h2>
    <p class="lead">The studio, the cast, and the world of The Ricky Spanish Show.</p>
  </div>

  <div class="gallery-grid">

    <figure class="shot">
      <img src="images/ricky-suit.jpg" alt="Ricky Spanish in his blue suit holding a microphone" loading="lazy">
      <figcaption><strong>The Host</strong>Ricky Spanish in his signature blue suit.</figcaption>
    </figure>

    <figure class="shot">
      <img src="images/studio-overlook.jpg" alt="Wide view of the Ricky Spanish Show studio" loading="lazy">
      <figcaption><strong>The Studio</strong>The full set from the back of the house.</figcaption>
    </figure>

    <figure class="shot">
      <img src="images/studio-stage-view.jpg" alt="View from the stage out over the audience seats" loading="lazy">
      <figcaption><strong>From the Stage</strong>The house as Ricky sees it.</figcaption>
    </figure>

    <figure class="shot">
      <img src="images/entrance.jpg" alt="Ricky Spanish making his entrance down the aisle" loading="lazy">
      <figcaption><strong>The Entrance</strong>Ricky comes down through the crowd.</figcaption>
    </figure>

    <figure class="shot">
      <img src="images/mercy-kiana.jpg" alt="Mercy Moore and Kiana seated in the guest chairs" loading="lazy">
      <figcaption><strong>The Guests</strong>Mercy Moore and Kiana in the guest chairs.</figcaption>
    </figure>

    <figure class="shot">
      <img src="images/kiana-chair.jpg" alt="Kiana seated in a guest chair" loading="lazy">
      <figcaption><strong>Kiana</strong>Guest chair, blue dress, sneakers — always sneakers.</figcaption>
    </figure>

    <figure class="shot">
      <img src="images/cartoon-ricky-neon.jpg" alt="Cartoon Ricky on a city corner at dusk" loading="lazy">
      <figcaption><strong>Cartoon Ricky</strong>Ricky in his own world.</figcaption>
    </figure>

    <figure class="shot">
      <img src="images/mansion-arrival.jpg" alt="Ricky approaching the BlackSheep Studios mansion with the blimp overhead" loading="lazy">
      <figcaption><strong>Arrival</strong>Ricky reaches the mansion, blimp overhead.</figcaption>
    </figure>
